# C4 arbitrary-auxiliary control: identical to c4_factor_dual EXCEPT the latent target is shuffled
# across masked cells (shuffle_target), so the auxiliary keeps dual's machinery, capacity, EMA, and
# value head but carries NO cell-aligned shared-latent signal. If this arm does NOT beat data-space
# while dual does, the gain is specific to the (correctly aligned) latent target, not generic
# auxiliary regularization -- earning "the instrument credits the latent target".
run_name: c4_factor_arbaux
prior_source: factor
policy_main: mixed
predictor: twoway-2
n_cls: 4
cls_target: true
lambda_ppd: 0.1
shuffle_target: true
r_scheme: rope
seed: 0
steps: 20000
batch_size: 8
lr: 0.001
emb: 256
heads: 8
mlp: 1024
layers: 6
n_bins: 32
prior:
  n_rows: [128, 384]
  n_cols: [12, 12]
  n_factors: 4
  sigma: 1.0
