# Tabular-JEPA v3 control: data-space objective (train.train, any_cell, bar head) on the v3 prior = real_ds_lr5e-4_s0
# with the prior swapped. Fallback arm if the latent recipe does not add on top of the strong prior.
batch_size: 4
emb: 256
heads: 8
layers: 6
lr: 0.0005
mlp: 1024
n_bins: 32
n_cls: 4
policy: any_cell
prior:
  filter_graphs: true
  filter_unpredictable: true
  max_cells: 65536
  max_classes: 10
  max_features: 100
  min_features: 1
  n_rows:
  - 128
  - 1024
  p_cls: 0.7
  p_missing_table: 0.3
  prefetch: 8
  prior_type: graph_scm
  task: mixed
  workers: 3
prior_source: tabicl
r_scheme: rope
run_name: PFN_tabicl2_ds_s0
seed: 0
steps: 20000
