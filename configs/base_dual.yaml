# #2 base FM: JEPA arm (latent target + value head). Scaled p6rc_dual.
# Matched to base_ds on EVERY hyperparameter except the objective. This is the
# headline comparison: same scale/prior/context, latent-prediction vs data-space.
policy_main: mixed
predictor: twoway-2
r_scheme: rope
n_cls: 4
cls_target: true
lambda_ppd: 0.1        # small data-space CE so the value head is usable (rollout/point pred)
run_name: base_dual
seed: 0
steps: 20000
batch_size: 8          # drop to 4 if the box OOMs
lr: 0.001
emb: 256
heads: 8
mlp: 1024
layers: 6
n_bins: 32
prior:
  n_rows: [128, 384]   # train <=512 (row-attn O(R^2) mem); set-based row attn
                       # extrapolates to 1024-shot at eval (CPU, forward-only)
  n_cols: [4, 32]
