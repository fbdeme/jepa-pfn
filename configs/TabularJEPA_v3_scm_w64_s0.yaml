# Tabular-JEPA v3 ablation: prior family (our paper SCM prior) at the same row / feature ranges as v3.
batch_size: 4
cls_target: false
ctx_only: true
curriculum_frac: 0.2
diff_target: true
dump_path: ''
ema: 0.996
emb: 256
feat: 5
head_on_pred: true
heads: 8
lambda_jepa: 1.0
lambda_ppd: 1.0
lambda_sig: 0.05
layers: 6
log_every: 25
lr: 0.0005
mlp: 1024
mode: ema
n_bins: 32
n_classes: 0
n_cls: 4
n_reg_tokens: 0
policy_main: mixed
predictor: twoway-4
prior:
  n_cols:            # capped at 64, not 100: the SCM prior has no cell budget (prior/tabicl.py max_cells crops rows), and
  - 2                #   100 x 1024 x batch 4 OOMs the 96 GB box (two attempts 2026-09-10, step 75); 64 x 1024 = the v3 budget (79 GB)
  - 64
  n_rows:
  - 128
  - 1024
r_invariant: false
r_scheme: rope
run_name: TabularJEPA_v3_scm_w64_s0
seed: 0
shuffle_target: false
sig_proj: 128
steps: 20000
val_batches: 16
val_every: 250
val_policy: any_cell
