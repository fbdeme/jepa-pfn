# Peak-memory smoke for Tabular-JEPA v3 on the 96 GB Blackwell: forces the widest, longest table the v3 prior can emit.
batch_size: 4
cls_target: false
ctx_only: true
curriculum_frac: 0.2
curriculum_steps: 10
diff_target: true
dump_path: ''
ema: 0.996
emb: 256
feat: 5
head_on_pred: true
heads: 8
lambda_jepa: 1.0
lambda_ppd: 1.0
lambda_sig: 0.05
layers: 6
log_every: 5
lr: 0.0005
mlp: 1024
mode: ema
n_bins: 32
n_classes: 0
n_cls: 4
n_reg_tokens: 0
policy_main: mixed
predictor: twoway-4
prior:
  filter_graphs: true
  filter_unpredictable: true
  max_cells: 102400
  max_classes: 10
  max_features: 100
  min_features: 100
  n_rows:
  - 1024
  - 1024
  p_cls: 0.7
  p_missing_table: 0.3
  prefetch: 8
  prior_type: graph_scm
  task: mixed
  workers: 3
prior_source: tabicl
r_invariant: false
r_scheme: rope
run_name: tjepa_v3_peak_smoke
seed: 0
shuffle_target: false
sig_proj: 128
steps: 40
val_batches: 2
val_every: 20
val_policy: any_cell
