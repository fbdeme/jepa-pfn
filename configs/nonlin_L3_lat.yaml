# Nonlinearity-ceiling smoke, PURE-LATENT arm at rung L3 (depth3/gain3->headroom +.119).
# base_lat_s settings (sigreg, lambda_sig 0.25, batch 4) + the L3 nonlinear prior. Learnability:
# JEPA loss decreases AND representation does not collapse (dim_std>0, cos<1) within 3k steps.
policy_main: mixed
predictor: twoway-2
r_scheme: rope
n_cls: 4
cls_target: true
lambda_ppd: 0.0
mode: sigreg
lambda_sig: 0.25
run_name: nonlin_L3_lat
seed: 0
steps: 3000
batch_size: 4
lr: 0.001
emb: 256
heads: 8
mlp: 1024
layers: 6
n_bins: 32
prior:
  n_rows: [128, 384]
  n_cols: [4, 32]
  mlp_depth: [3, 3]
  mlp_gain: 2.0
