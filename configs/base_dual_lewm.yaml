# #24 dual+LeWM ABLATION (recommended: cheap, base scale). base_dual but with
# SIGReg/LeWM anti-collapse (mode: sigreg) instead of EMA target, value head KEPT.
# Purpose: de-confound the lat-vs-dual comparison. Currently dual=EMA, lat=sigreg,
# so a skeptic can attribute lat's failure to EMA-vs-sigreg rather than the objective.
# This holds the value head fixed and swaps ONLY the anti-collapse mechanism, enabling:
#   dual(EMA) vs dual(LeWM)        = anti-collapse effect, value head fixed
#   lat_s(LeWM,no head) vs this    = value-head effect, anti-collapse fixed
# rigor is scale-independent, so base (emb256, ~1h) suffices; big_dual_lewm exists for
# max-rigor on the headline scale. Everything else matched to base_dual.
policy_main: mixed
predictor: twoway-2
r_scheme: rope
n_cls: 4
cls_target: true
lambda_ppd: 0.1        # matched to base_dual (value head usable)
mode: sigreg           # LeWM/LeJEPA anti-collapse instead of EMA target
lambda_sig: 0.4        # BUMPED 0.25->0.4: at 0.25 the value head's data-space gradient
                       # overwhelmed SIGReg and the encoder fully collapsed (dim_std->0,
                       # cos->1) by ~step 1200, though headless base_lat_s held at 0.25.
                       # 0.4 is the direct anti-collapse fix. NOTE: this makes dual_lewm's
                       # lambda_sig differ from base_lat_s (0.25), so the CLEAN comparison
                       # is dual(EMA) vs dual_lewm(sigreg) with the value head fixed at
                       # lambda_ppd 0.1 -- lambda_sig is intrinsic to sigreg, no EMA analog.
run_name: base_dual_lewm
seed: 0
steps: 20000
batch_size: 4          # matched to base_lat_s: sigreg's 2x-grad online pass OOMs at
                       # batch 8 even on 16GB, and base_lat_s (the sigreg reference)
                       # trained at batch 4. This makes dual_lewm = base_lat_s + value
                       # head, an exact single-variable (value-head on/off) comparison.
lr: 0.0005             # HALVED from 0.001: at 0.001 the sigreg+value-head combo diverges
                       # into full collapse (loss explodes to 6000+, dim_std->0) by ~step
                       # 2000 EVEN at lambda_sig 0.4 -- collapse is an absorbing state and
                       # SIGReg's clipped corrective gradient can't escape it once reached.
                       # Lower lr slows the approach so SIGReg stabilizes the spread first.
                       # (base_lat_s at lr 0.001 was stable only because it had no value head.)
emb: 256
heads: 8
mlp: 1024
layers: 6
n_bins: 32
prior:
  n_rows: [128, 384]
  n_cols: [4, 32]
