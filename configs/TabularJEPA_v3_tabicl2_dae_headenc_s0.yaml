# Tabular-JEPA v3 architecture ladder 2 (docs/prior_v2_plan.md section 5.2, design fixed 2026-09-11): TabularJEPA_v3_tabicl2_s0
# with headenc + the EMA copy replaced by a denoising y-encoder (second CellPFN, Gaussian noise sigma .5 on the full table,
# reconstruction bin CE on every valued cell trains it alone); its hidden-cell embedding (detach + LayerNorm) is the target.
# ckpt_pass2: the second grad pass (full table) is gradient-checkpointed - the 2026-09-11 peak smoke OOMed the 96 GB box without it (97 GB).
batch_size: 4
ckpt_pass2: true
cls_target: false
ctx_only: true
curriculum_frac: 0.2
dae_sigma: 0.5
diff_target: false
dump_path: ''
ema: 0.996
emb: 256
feat: 5
head_on_pred: false
heads: 8
lambda_jepa: 1.0
lambda_ppd: 1.0
lambda_sig: 0.05
layers: 6
log_every: 25
lr: 0.0005
mlp: 1024
mode: dae
n_bins: 32
n_classes: 0
n_cls: 4
n_reg_tokens: 0
policy_main: mixed
predictor: twoway-4
prior:
  filter_graphs: true
  filter_unpredictable: true
  max_cells: 65536
  max_classes: 10
  max_features: 100
  min_features: 1
  n_rows:
  - 128
  - 1024
  p_cls: 0.7
  p_missing_table: 0.3
  prefetch: 8
  prior_type: graph_scm
  task: mixed
  workers: 3
prior_source: tabicl
r_invariant: false
r_scheme: rope
run_name: TabularJEPA_v3_tabicl2_dae_headenc_s0
seed: 0
shuffle_target: false
sig_proj: 128
steps: 20000
val_batches: 16
val_every: 250
val_policy: any_cell
