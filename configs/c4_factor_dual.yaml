# C4 positive control: latent+value-head (dual, EMA) on the latent-favorable factor substrate.
# base_dual settings, identical to matched_L4_dual except prior_source=factor.
run_name: c4_factor_dual
prior_source: factor
policy_main: mixed
predictor: twoway-2
n_cls: 4
cls_target: true
lambda_ppd: 0.1
r_scheme: rope
seed: 0
steps: 20000
batch_size: 8
lr: 0.001
emb: 256
heads: 8
mlp: 1024
layers: 6
n_bins: 32
prior:
  n_rows: [128, 384]
  n_cols: [12, 12]
  n_factors: 4
  sigma: 1.0
