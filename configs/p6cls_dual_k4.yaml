# Issue #19 insurance: CLS latent + auxiliary cell CE. The issue flags collapse
# as the main risk here (a constant CLS makes the loss 0; Var-JEPA variant G is
# the warning), and #10 found dual >= pure on structural probes. lambda_ppd=0.1
# matches p3d_ppd_01. If the pure arm's CLS collapse stats go bad, this is the
# arm that still reports.
run_name: p6cls_dual_k4
policy_main: mixed
predictor: twoway-2
n_cls: 4
cls_target: true
lambda_ppd: 0.1
seed: 0
steps: 20000
