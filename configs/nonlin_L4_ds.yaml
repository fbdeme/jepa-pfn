# Nonlinearity-ceiling smoke rung L4 (docs/scm_nonlinearity_ceiling.md). base_ds arch/regime;
# only mlp_depth/mlp_gain differ. Learnability: val_mse descends vs sticks at ~1.0.
run_name: nonlin_L4_ds
policy: any_cell
r_scheme: rope
n_cls: 4
seed: 0
steps: 3000
batch_size: 8
lr: 0.001
emb: 256
heads: 8
mlp: 1024
layers: 6
n_bins: 32
prior:
  n_rows: [128, 384]
  n_cols: [4, 32]
  mlp_depth: [3, 3]
  mlp_gain: 3.0
