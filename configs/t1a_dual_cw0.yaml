# Issue #23 T1a ablation baseline: DUAL arm with consumption OFF (consume_weight=0).
# Identical to t1a_dual in every other way (same squashed prior, arch, seed) so the
# oracle_latent-oracle_value gap vs t1a_dual isolates the consumption-training effect
# from the prior change. = "t0rc_dual reproduced on the tail-stabilized prior".
run_name: t1a_dual_cw0
base: jepa
policy_main: mixed
predictor: twoway-2
r_scheme: rope
n_cls: 4
cls_target: true
seed: 0
steps: 20000
batch_size: 8       # match t1a_dual (paired); 8GB box OOMs at 16 concurrent
lambda_ppd: 0.1
consume_weight: 0.0
prior:
  temporal: [3, 6]
  temporal_squash: true
  p_missing_table: 0.0
